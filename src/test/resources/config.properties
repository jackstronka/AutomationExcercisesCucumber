# =========================
# ENVIRONMENT
# =========================
env=local

# =========================
# APPLICATION
# =========================
baseUrl=https://automationexercise.com

# =========================
# BROWSER CONFIG
# =========================
browser=chrome
headless=true
windowWidth=1200
windowHeight=800
maximizeWindow=true

# =========================
# TIMEOUTS (seconds)
# =========================
implicitWait=0
explicitWait=10
pageLoadTimeout=30
# Page load: normal = full load (default), eager = DOM only (faster; try if tests are stable)
pageLoadStrategy=normal
orderSuccessWaitTimeout=15
accountDeletedWaitTimeout=15
# Short timeout for alert – when already accepted in clickSubmit, avoids ~10s delay
alertWaitTimeout=2
